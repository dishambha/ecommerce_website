{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<h1>My Profile</h1>
<div class="card" style="max-width:600px;">
  <p><strong>Email:</strong> {{ user.email }}</p>
  <p style="margin-top:0.75rem;"><strong>Username:</strong> {{ user.username }}</p>
  <p style="margin-top:0.75rem;"><strong>Phone:</strong> {{ user.phone|default:"—" }}</p>
  <p style="margin-top:0.75rem;"><strong>Joined:</strong> {{ user.date_joined|date:"N j, Y" }}</p>
  <div style="margin-top:1.5rem; display:flex; gap:0.75rem;">
    <a href="/orders/history/" class="btn btn-primary">My Orders</a>
    <a href="/wishlist/" class="btn" style="background:#2d3748; color:#e2e8f0;">My Wishlist</a>
  </div>
</div>
{% endblock %}
